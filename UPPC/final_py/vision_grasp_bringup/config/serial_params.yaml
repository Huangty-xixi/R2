# 串口桥节点参数
serial_bridge:
  ros__parameters:
    port: "/dev/ttyUSB_serial"        # 有线串口设备
    baudrate: 115200
    send_rate_hz: 50.0                # 串口发送频率（里程计上行限频）
    read_poll_hz: 200.0               # 串口读取轮询频率
    odom_topic: "/odometry"
    target_topic: "/target_depth"
    arrival_topic: "/arrival_trigger"
    camera_cmd_topic: "/camera_command"

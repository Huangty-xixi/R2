amcl:
  ros__parameters:
    use_sim_time: false
    # 开启自动初始化
    set_initial_pose: true
    
    # 填入定点的坐标
    initial_pose:
      x: 0.5           # 定点 X
      y: 0.5          # 定点 Y
      z: 0.0
      yaw: 0.0         # 定点朝向 (弧度)
    
    # 增加初始协方差 (允许摆放时有一点点误差，AMCL会自动修正)
    initial_cov_xx: 0.25  # 允许 X 方向有 0.5米的误差
    initial_cov_yy: 0.25  # 允许 Y 方向有 0.5米的误差
    initial_cov_aa: 0.1   # 允许 角度 有一点误差
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    min_particles: 500
    max_particles: 2000
    scan_topic: scan
    scan_topic_qos_reliability: "best_effort"
    tf_broadcast: true  # 允许 AMCL 发布 map->odom 的变换s

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: "map"
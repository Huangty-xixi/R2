amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    min_particles: 500
    max_particles: 2000
    # 关键：必须匹配转换后的 2D 话题
    scan_topic: scan
    scan_topic_qos_reliability: "best_effort"
    tf_broadcast: true  # 允许 AMCL 发布 map->odom 的变换

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: "map"